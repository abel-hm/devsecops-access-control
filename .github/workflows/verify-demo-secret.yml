name: Verify demo repository secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the demo secret is configured (without printing it)
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -n "$DINEDESK_DEMO_KEY" ]; then
            echo "DINEDESK_DEMO_KEY is configured (value not printed)."
          else
            echo "DINEDESK_DEMO_KEY is missing."
            exit 1
          fi
